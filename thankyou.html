  <body class="thankyou-page">
    <div class="container">
      <div class="row justify-content-center align-items-center vh-100">
        <div class="col-lg-7">
          <div class="thankyou-card text-center">
            <div class="success-icon">
              <i class="bi bi-check-circle-fill"></i>
            </div>

            <h1 class="display-4 fw-bold mt-4">Thank You!</h1>

            <p class="lead text-muted mt-3">
              Your message has been successfully submitted.

            <p class="text-secondary">
              One of our consultants will review your enquiry and respond within

            </p>

            <hr />

            <div class="row mt-4">
              <div class="col-md-4">
                <h5>
                  <i class="bi bi-envelope-fill text-primary"></i>
                </h5>

                <p>Email Reply</p>
              </div>

              <div class="col-md-4">
                <h5>
                  <i class="bi bi-clock-fill text-success"></i>
                </h5>

                <p>Within 24 Hours</p>
              </div>

              <div class="col-md-4">
                <h5>
                  <i class="bi bi-headset text-danger"></i>
                </h5>

                <p>Professional Support</p>
              </div>
            </div>

            <a
              href="index.html"
              class="btn btn-primary btn-lg rounded-pill mt-5 px-5"
            >
              <i class="bi bi-house-door-fill me-2"></i>

              Back to Home
            </a>
          </div>
        </div>
      </div>
    </div>
